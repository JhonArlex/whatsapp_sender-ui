server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: servir index.html para todas las rutas del frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso: /api/ → bulk-sender-api:8010
    # Esto evita mixed content (HTTPS en UI, HTTP en API)
    # y problemas de CORS/auth en imágenes
    location /api/ {
        proxy_pass http://bulk-sender-api:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
